services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rrrgroupcrm-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - rrrgroupcrm
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  nginx:
    image: nginx:alpine
    container_name: rrrgroupcrm-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - rrrgroupcrm
    depends_on:
      - app

  postgres:
    image: postgres:17-alpine
    container_name: rrrgroupcrm-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_EXTERNAL_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-rrrgroupcrm}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - rrrgroupcrm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-rrrgroupcrm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: rrrgroupcrm-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-data:/data
    networks:
      - rrrgroupcrm
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  rrrgroupcrm:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
